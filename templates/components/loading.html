<!-- Global Loading Overlay -->
<div id="global-loading" class="fixed inset-0 bg-black bg-opacity-50 z-[100] hidden items-center justify-center">
    <div class="bg-white rounded-2xl p-8 flex flex-col items-center">
        <!-- Spinner -->
        <div class="relative">
            <div class="w-16 h-16 border-4 border-gray-200 rounded-full"></div>
            <div class="w-16 h-16 border-4 border-purple-600 rounded-full border-t-transparent animate-spin absolute top-0 left-0"></div>
        </div>
        <p class="mt-4 text-gray-700 font-medium">Loading...</p>
        <p class="text-sm text-gray-500 mt-1" id="loading-message">Please wait</p>
    </div>
</div>

<!-- Skeleton Loader for Cards -->
<div class="skeleton-card bg-white rounded-2xl shadow-lg overflow-hidden">
    <div class="animate-pulse">
        <div class="bg-gray-300 h-64 w-full"></div>
        <div class="p-6 space-y-4">
            <div class="h-6 bg-gray-300 rounded w-3/4"></div>
            <div class="h-4 bg-gray-300 rounded w-1/2"></div>
            <div class="h-4 bg-gray-300 rounded w-full"></div>
            <div class="h-4 bg-gray-300 rounded w-5/6"></div>
            <div class="flex space-x-3">
                <div class="h-10 bg-gray-300 rounded flex-1"></div>
                <div class="h-10 bg-gray-300 rounded flex-1"></div>
            </div>
        </div>
    </div>
</div>

<!-- Skeleton Loader for Profile -->
<div class="skeleton-profile animate-pulse">
    <div class="bg-gray-300 h-48 rounded-t-2xl"></div>
    <div class="p-6">
        <div class="flex items-center">
            <div class="w-24 h-24 bg-gray-300 rounded-full -mt-12 border-4 border-white"></div>
            <div class="ml-4 flex-1">
                <div class="h-6 bg-gray-300 rounded w-48 mb-2"></div>
                <div class="h-4 bg-gray-300 rounded w-32"></div>
            </div>
        </div>
        <div class="mt-6 space-y-3">
            <div class="h-4 bg-gray-300 rounded w-full"></div>
            <div class="h-4 bg-gray-300 rounded w-5/6"></div>
            <div class="h-4 bg-gray-300 rounded w-4/6"></div>
        </div>
    </div>
</div>

<script>
function showLoading(message = 'Please wait...') {
    const loadingDiv = document.getElementById('global-loading');
    const messageSpan = document.getElementById('loading-message');
    if (messageSpan) messageSpan.textContent = message;
    if (loadingDiv) {
        loadingDiv.classList.remove('hidden');
        loadingDiv.classList.add('flex');
    }
}

function hideLoading() {
    const loadingDiv = document.getElementById('global-loading');
    if (loadingDiv) {
        loadingDiv.classList.add('hidden');
        loadingDiv.classList.remove('flex');
    }
}

// Auto-hide loading after timeout (safety)
window.showLoadingWithTimeout = function(message, timeout = 30000) {
    showLoading(message);
    setTimeout(() => {
        hideLoading();
    }, timeout);
};
</script>
