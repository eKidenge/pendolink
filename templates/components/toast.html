<!-- Toast Notification Container -->
<div id="toast-container" class="fixed bottom-4 right-4 z-50 space-y-2">
    <!-- Toasts will be added here dynamically -->
</div>

<script>
function showNotification(type, message, duration = 5000) {
    const container = document.getElementById('toast-container');
    const toast = document.createElement('div');
    
    const icons = {
        success: 'fa-check-circle',
        error: 'fa-exclamation-circle',
        warning: 'fa-exclamation-triangle',
        info: 'fa-info-circle'
    };
    
    const colors = {
        success: 'border-green-500 bg-green-50',
        error: 'border-red-500 bg-red-50',
        warning: 'border-yellow-500 bg-yellow-50',
        info: 'border-blue-500 bg-blue-50'
    };
    
    const textColors = {
        success: 'text-green-800',
        error: 'text-red-800',
        warning: 'text-yellow-800',
        info: 'text-blue-800'
    };
    
    toast.className = `transform transition-all duration-300 translate-x-full bg-white rounded-lg shadow-lg p-4 max-w-sm border-l-4 ${colors[type]} slide-in`;
    toast.innerHTML = `
        <div class="flex items-center">
            <div class="flex-shrink-0">
                <i class="fas ${icons[type]} ${textColors[type]} text-xl"></i>
            </div>
            <div class="ml-3 flex-1">
                <p class="text-sm font-medium ${textColors[type]}">${message}</p>
            </div>
            <button onclick="this.parentElement.parentElement.remove()" class="ml-auto">
                <i class="fas fa-times text-gray-400 hover:text-gray-600"></i>
            </button>
        </div>
        <div class="progress-bar mt-2 h-1 bg-gray-200 rounded-full overflow-hidden">
            <div class="h-full ${type === 'success' ? 'bg-green-500' : type === 'error' ? 'bg-red-500' : type === 'warning' ? 'bg-yellow-500' : 'bg-blue-500'}" 
                 style="width: 100%; transition: width ${duration}ms linear;"></div>
        </div>
    `;
    
    container.appendChild(toast);
    
    // Animate in
    setTimeout(() => {
        toast.style.transform = 'translateX(0)';
    }, 10);
    
    // Animate progress bar
    const progressBar = toast.querySelector('.progress-bar div');
    setTimeout(() => {
        if (progressBar) progressBar.style.width = '0%';
    }, 10);
    
    // Auto remove
    setTimeout(() => {
        toast.style.transform = 'translateX(100%)';
        setTimeout(() => toast.remove(), 300);
    }, duration);
}
</script>
